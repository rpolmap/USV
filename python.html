<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Output</title>
<style>
  body { margin: 0; padding: 16px; font-family: monospace; }
  pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<pre id="out"></pre>
<script>
  const out = document.getElementById('out');

  // Try the live server first (python server.py), then fall back to a saved output.txt
  async function load(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }

  load('run')
    .catch(() => load('output.txt'))
    .then(t => { out.textContent = t; })
    .catch(() => { out.textContent = 'No output available.'; });
</script>
</body>
</html>
