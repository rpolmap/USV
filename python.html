<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Output</title>
<style>
  body { margin: 0; padding: 16px; font-family: monospace; }
  pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; display: inline; }
  #in { font: inherit; border: none; outline: none; background: transparent;
        color: inherit; width: 60%; padding: 0; }
</style>
</head>
<body>
<pre id="out"></pre><input id="in" type="text" autocomplete="off" autofocus>
<script>
  const out = document.getElementById('out');
  const inp = document.getElementById('in');
  let timer;

  async function poll() {
    try {
      const r = await fetch('output', { cache: 'no-store' });
      if (!r.ok) throw new Error();
      out.textContent = await r.text();
      window.scrollTo(0, document.body.scrollHeight);
    } catch (e) {
      out.textContent = 'No output available.';
      clearInterval(timer);
    }
  }

  inp.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const v = inp.value;
    inp.value = '';
    await fetch('send', { method: 'POST', body: v });
    poll();
  });

  fetch('start').then(() => { timer = setInterval(poll, 300); poll(); })
                .catch(() => { out.textContent = 'No output available.'; });
</script>
</body>
</html>
