<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providence Materials</title>
    <!-- Tailwind CSS for clean modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4">

    <!-- Header Section -->
    <header class="text-center mb-12">
        <h1 class="text-5xl sm:text-7xl font-extrabold tracking-tight text-white mb-2">
            Providence
        </h1>
        <p class="text-xl sm:text-2xl font-light text-slate-400 tracking-wide">
            Materials
        </p>
    </header>

    <!-- Navigation / Buttons Section -->
    <main class="w-full max-w-md flex flex-col gap-4">
        
        <!-- Parliament Visualization Link Button -->
        <a href="parliament.html" 
           class="w-full text-center py-4 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-lg shadow-indigo-600/30 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0">
            Parliament Visualization
        </a>

        <!-- Fandom Search Trigger Button (Keeps exact styling) -->
        <button onclick="toggleSearchModal()" 
                class="w-full text-center py-4 px-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold border border-slate-700/50 shadow-lg transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
            Fandom
        </button>

    </main>

    <!-- ADDED: Search Modal Popup -->
    <div id="searchModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
            
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white">Providence Wiki Search</h2>
                <button onclick="toggleSearchModal()" class="text-slate-400 hover:text-white text-2xl font-bold cursor-pointer">&times;</button>
            </div>

            <input type="text" 
                   id="wikiSearchInput"
                   placeholder="Search Providence Wiki..." 
                   oninput="runProvidenceSearch(this.value, 'searchResults')"
                   class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">

            <div id="searchResults" class="mt-4 max-h-60 overflow-y-auto space-y-2"></div>

        </div>
    </div>

    <!-- ADDED: Link your existing fandom.js file -->
    <script src="fandom.js"></script>

    <!-- ADDED: Small helper script to toggle the popup open/closed -->
    <script>
        function toggleSearchModal() {
            const modal = document.getElementById('searchModal');
            const isHidden = modal.classList.contains('hidden');
            
            if (isHidden) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.getElementById('wikiSearchInput').focus();
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }
    </script>

</body>
</html>
