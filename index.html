<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f6f3;
            --fg: #14161a;
            --muted: #6b7078;
            --panel: #ffffff;
            --line: #dcdcd6;
            --btn-bg: #14161a;      /* buttons: opposite of page background */
            --btn-fg: #f6f6f3;
            --overlay: rgba(20, 22, 26, 0.45);
        }
        :root[data-theme="dark"] {
            --bg: #14161a;
            --fg: #f2f2ee;
            --muted: #9aa0a8;
            --panel: #1c1f25;
            --line: #2c3037;
            --btn-bg: #f2f2ee;
            --btn-fg: #14161a;
            --overlay: rgba(0, 0, 0, 0.65);
        }

        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: background .25s, color .25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1rem;
        }

        /* Theme switch */
        .theme-switch {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 52px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--panel);
            cursor: pointer;
            padding: 0;
            transition: background .25s, border-color .25s;
        }
        .theme-switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--fg);
            transition: transform .25s, background .25s;
        }
        :root[data-theme="dark"] .theme-switch::after { transform: translateX(24px); }
        .theme-switch:focus-visible,
        .dash-btn:focus-visible,
        #wikiSearchInput:focus-visible,
        .close-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

        /* Title */
        header { margin-top: clamp(4rem, 14vh, 9rem); text-align: center; }
        h1 {
            font-size: clamp(3rem, 12vw, 6.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        /* Dashboard list */
        .dashboard {
            width: 100%;
            max-width: 32rem;
            margin-top: clamp(2.5rem, 7vh, 4.5rem);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 0.75rem;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: background .25s, border-color .25s;
        }
        .dash-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            font: inherit;
            font-weight: 600;
            padding: 1.1rem 1.5rem;
            border: none;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            cursor: pointer;
            transition: background .25s, color .25s, transform .15s;
        }
        .dash-btn:hover { transform: translateY(-2px); }
        .dash-btn:active { transform: translateY(0); }

        /* Fandom search modal */
        #searchModal {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 50;
        }
        #searchModal.open { display: flex; }
        .modal-card {
            width: 100%;
            max-width: 32rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .modal-head h2 { font-size: 1.25rem; font-weight: 700; }
        .close-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.75rem;
            line-height: 1;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--fg); }
        #wikiSearchInput {
            width: 100%;
            padding: 0.8rem 1rem;
            font: inherit;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        #wikiSearchInput::placeholder { color: var(--muted); }
        #searchResults {
            margin-top: 1rem;
            max-height: 15rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        #searchResults a { color: var(--fg); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <button class="theme-switch" id="themeSwitch" type="button"
            role="switch" aria-checked="false" aria-label="Dark mode"></button>

    <header>
        <h1>Providence</h1>
    </header>

    <ul class="dashboard">
        <li>
            <button class="dash-btn" type="button" onclick="toggleSearchModal()">Search on Fandom</button>
        </li>
        <li>
            <a class="dash-btn" href="parliament.html">Parliament Tool</a>
        </li>
    </ul>

    <!-- Fandom search modal -->
    <div id="searchModal" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
        <div class="modal-card">
            <div class="modal-head">
                <h2 id="searchTitle">Providence Wiki Search</h2>
                <button class="close-btn" type="button" onclick="toggleSearchModal()" aria-label="Close">&times;</button>
            </div>

            <input type="text"
                   id="wikiSearchInput"
                   placeholder="Search Providence Wiki..."
                   oninput="runProvidenceSearch(this.value, 'searchResults')">

            <div id="searchResults"></div>
        </div>
    </div>

    <!-- Your existing fandom.js file -->
    <script src="fandom.js"></script>

    <script>
        // Fandom modal toggle
        function toggleSearchModal() {
            const modal = document.getElementById('searchModal');
            const opening = !modal.classList.contains('open');
            modal.classList.toggle('open', opening);
            if (opening) document.getElementById('wikiSearchInput').focus();
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('searchModal').classList.contains('open')) {
                toggleSearchModal();
            }
        });
        document.getElementById('searchModal').addEventListener('click', e => {
            if (e.target.id === 'searchModal') toggleSearchModal();
        });

        // Theme switch (light by default)
        const root = document.documentElement;
        const switchBtn = document.getElementById('themeSwitch');
        function setTheme(theme) {
            root.setAttribute('data-theme', theme);
            switchBtn.setAttribute('aria-checked', theme === 'dark');
            try { localStorage.setItem('providence-theme', theme); } catch (e) {}
        }
        try {
            const saved = localStorage.getItem('providence-theme');
            if (saved) setTheme(saved);
        } catch (e) {}
        switchBtn.addEventListener('click', () => {
            setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
    </script>

</body>
</html>
