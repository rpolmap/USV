<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Login Card -->
    <div id="card" class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/50 p-8 shadow-2xl transition-all duration-300">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Login</h1>
            <p class="text-slate-400 text-sm">Enter your 4-digit security code to access</p>
        </div>

        <!-- 4-Digit Input Container -->
        <div class="flex justify-center gap-3 mb-6" id="otp-container">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200" autocomplete="off">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-14 h-16 text-center text-2xl font-bold rounded-xl bg-slate-900/60 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200" autocomplete="off">
        </div>

        <!-- Error / Status Message -->
        <div id="message" class="text-center text-sm min-h-[24px] mb-6 font-medium transition-opacity duration-200 opacity-0"></div>

        <!-- Submit Button -->
        <button id="submit-btn" disabled class="w-full py-3.5 px-4 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-indigo-600 transition-all duration-200 shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
            <span>Verify & Continue</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
        </button>
    </div>

    <!-- Dashboard View (Initially Hidden) -->
    <div id="dashboard" class="hidden text-center max-w-lg w-full bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/50 p-10 shadow-2xl">
        <h1 class="text-5xl font-extrabold text-white tracking-tight mb-8">Dashboard</h1>
        <button class="px-6 py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition-all duration-200 shadow-lg shadow-indigo-600/20 active:scale-95">
            Calendar
        </button>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const submitBtn = document.getElementById('submit-btn');
        const message = document.getElementById('message');
        const card = document.getElementById('card');
        const dashboard = document.getElementById('dashboard');
        const VALID_CODE = "1753";

        // Auto-focus first input on page load
        window.addEventListener('load', () => inputs[0].focus());

        // Process inputs and navigation
        inputs.forEach((input, index) => {
            // Handle input typing
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Allow only digits
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Focus next input if a digit is entered
                if (value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }

                checkCodeCompleteness();
            });

            // Handle backspace navigation
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (!e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                } else if (e.key === 'Enter') {
                    if (getCode().length === 4) {
                        validateAndRedirect();
                    }
                }
            });

            // Handle paste action for 4 digits
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').trim();
                
                if (/^\d{4}$/.test(pastedData)) {
                    pastedData.split('').forEach((char, i) => {
                        inputs[i].value = char;
                    });
                    inputs[3].focus();
                    checkCodeCompleteness();
                }
            });
        });

        // Get full entered code string
        function getCode() {
            let code = '';
            inputs.forEach(input => code += input.value);
            return code;
        }

        // Enable or disable button based on length
        function checkCodeCompleteness() {
            const code = getCode();
            submitBtn.disabled = code.length !== 4;
            hideMessage();
        }

        // Display feedback message
        function showMessage(text, isError = true) {
            message.textContent = text;
            message.className = `text-center text-sm min-h-[24px] mb-6 font-medium transition-opacity duration-200 opacity-100 ${isError ? 'text-red-400' : 'text-emerald-400'}`;
        }

        // Hide feedback message
        function hideMessage() {
            message.classList.add('opacity-0');
        }

        // Validate code and execute view change or error animation
        function validateAndRedirect() {
            const code = getCode();

            if (code === VALID_CODE) {
                showMessage("Success! Loading dashboard...", false);
                inputs.forEach(i => i.classList.add('border-emerald-500', 'text-emerald-400'));
                
                // Reveal dashboard after brief visual confirmation
                setTimeout(() => {
                    card.classList.add('hidden');
                    dashboard.classList.remove('hidden');
                }, 800);
            } else {
                showMessage("Incorrect code. Please try again.", true);
                
                // Shake card animation
                card.classList.add('shake');
                inputs.forEach(i => i.classList.add('border-red-500'));

                setTimeout(() => {
                    card.classList.remove('shake');
                }, 400);

                // Highlight wrong entries and clear inputs
                setTimeout(() => {
                    inputs.forEach(i => {
                        i.value = '';
                        i.classList.remove('border-red-500');
                    });
                    inputs[0].focus();
                    submitBtn.disabled = true;
                }, 1000);
            }
        }

        // Button click event listener
        submitBtn.addEventListener('click', validateAndRedirect);
    </script>
</body>
</html>
