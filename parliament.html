<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parliament Chart</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { background: #f3f4f6; }
  html.dark body { background: #0f172a; }
</style>
</head>
<body class="text-slate-800 dark:text-slate-100">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

let _id = 0;
const uid = () => 'p' + (++_id);
const mk = (name, seats, color) => ({ id: uid(), name, seats, color });
const PALETTE = ['#e11d48','#2563eb','#16a34a','#f59e0b','#7c3aed','#0891b2','#db2777','#65a30d'];

const PRESETS = {
  three: { label: 'Three parties (100)', rows: 5, size: 11, parties: () => [mk('Blue', 45, '#2563eb'), mk('Red', 35, '#e11d48'), mk('Green', 20, '#16a34a')] },
  bundestag: { label: 'Bundestag 2021 (736)', rows: 12, size: 5, parties: () => [
    mk('Linke', 39, '#be3075'), mk('SPD', 206, '#e3000f'), mk('Grüne', 118, '#46962b'), mk('SSW', 1, '#003c8f'),
    mk('FDP', 92, '#ffcc00'), mk('CDU/CSU', 197, '#444444'), mk('AfD', 83, '#009ee0')] },
  senate: { label: 'US Senate (100)', rows: 5, size: 11, parties: () => [mk('Democrats', 45, '#2563eb'), mk('Independents', 2, '#8b5cf6'), mk('Republicans', 53, '#dc2626')] },
  empty: { label: 'Empty', rows: 5, size: 10, parties: () => [] },
};

// Largest-remainder distribution of N proportional to weights
function distribute(N, weights) {
  const s = weights.reduce((a, b) => a + b, 0);
  if (!s) return weights.map(() => 0);
  const raw = weights.map(w => N * w / s);
  const base = raw.map(Math.floor);
  const left = N - base.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - base[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => base[i]++);
  return base;
}
const ringRows = (N, radii) => distribute(N, radii);
const splitEven = (N, k) => distribute(N, Array(k).fill(1));
const sizeFor = (N, rows) => Math.max(2, Math.min(11, Math.round(Math.min(0.3 * Math.sqrt(216000 / Math.max(N, 1)), 250 / rows / 2.3))));
const rowsFor = N => Math.max(1, Math.min(20, Math.round(Math.sqrt(N) / 2.2)));

function App() {
  const [parties, setParties] = useState(PRESETS.three.parties());
  const [layout, setLayout] = useState('hemicycle');
  const [rows, setRows] = useState(5);
  const [size, setSize] = useState(11);
  const [margin, setMargin] = useState(8);
  const [inner, setInner] = useState(120);
  const [outer, setOuter] = useState(400);
  const [coalition, setCoalition] = useState([]);
  const [hoverParty, setHoverParty] = useState(null);
  const [hoverSeat, setHoverSeat] = useState(null);
  const [tab, setTab] = useState('parties');
  const [dark, setDark] = useState(false);
  const [preset, setPreset] = useState('three');
  const [scaleTo, setScaleTo] = useState(100);

  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  const total = parties.reduce((a, p) => a + p.seats, 0);
  const majority = Math.floor(total / 2) + 1;
  const coalSeats = parties.filter(p => coalition.includes(p.id)).reduce((a, p) => a + p.seats, 0);

  const seats = useMemo(() => {
    if (!total) return [];
    const R = Math.max(1, rows);
    const radii = Array.from({ length: R }, (_, i) => R === 1 ? (inner + outer) / 2 : inner + (outer - inner) * i / (R - 1));
    let pts = [];
    if (layout === 'hemicycle' || layout === 'circle') {
      const hemi = layout === 'hemicycle';
      const m = hemi ? margin * Math.PI / 180 : 0;
      const span = hemi ? Math.PI - 2 * m : 2 * Math.PI;
      const counts = ringRows(total, radii);
      radii.forEach((r, i) => {
        const n = counts[i];
        for (let k = 0; k < n; k++) {
          const f = hemi ? (n === 1 ? 0.5 : k / (n - 1)) : k / n;
          const t = (hemi ? Math.PI - m : Math.PI) - f * span;
          pts.push({ x: r * Math.cos(t), y: -r * Math.sin(t), key: Math.PI - t, r });
        }
      });
      pts.sort((a, b) => a.key - b.key || a.r - b.r);
    } else if (layout === 'classroom') {
      const sp = size * 2.6;
      distribute(total, radii.map((_, i) => i + 3)).forEach((n, i) => {
        for (let k = 0; k < n; k++) pts.push({ x: Math.round((k - (n - 1) / 2) * sp * 10) / 10, y: i * sp * 1.4 });
      });
      pts.sort((a, b) => a.x - b.x || a.y - b.y);
    } else {
      const sp = size * 2.6;
      const L = Math.ceil(total / 2);
      [[L, -1], [total - L, 1]].forEach(([n, s]) => {
        for (let j = 0; j < n; j++) {
          const col = j % R, row = Math.floor(j / R);
          pts.push({ x: s * (inner / 2 + 20 + col * sp), y: row * sp });
        }
      });
      pts.sort((a, b) => a.x - b.x || a.y - b.y);
    }
    let idx = 0;
    parties.forEach((p, pi) => { for (let c = 0; c < p.seats && idx < pts.length; c++) pts[idx++].p = pi; });
    return pts;
  }, [parties, layout, rows, size, margin, inner, outer, total]);

  const viewBox = useMemo(() => {
    if (!seats.length) return '0 0 100 100';
    const pad = size * 2;
    const xs = seats.map(s => s.x), ys = seats.map(s => s.y);
    const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
    return `${x0} ${y0} ${Math.max(...xs) + pad - x0} ${Math.max(...ys) + pad - y0}`;
  }, [seats, size]);

  const update = (id, patch) => setParties(ps => ps.map(p => p.id === id ? { ...p, ...patch } : p));
  const toggleCoal = id => setCoalition(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id]);
  const remove = id => { setParties(ps => ps.filter(p => p.id !== id)); setCoalition(c => c.filter(x => x !== id)); };
  const add = () => setParties(ps => [...ps, mk('Party ' + (ps.length + 1), 10, PALETTE[ps.length % PALETTE.length])]);
  const loadPreset = key => {
    const pr = PRESETS[key];
    const ps = pr.parties();
    setPreset(key); setParties(ps); setRows(pr.rows); setSize(pr.size); setCoalition([]);
    setScaleTo(ps.reduce((a, p) => a + p.seats, 0));
  };
  const scale = () => {
    const t = Math.max(0, Math.round(scaleTo) || 0);
    if (!total || !parties.length) return;
    const counts = distribute(t, parties.map(p => p.seats));
    setParties(ps => ps.map((p, i) => ({ ...p, seats: counts[i] })));
    const r = rowsFor(t);
    setRows(r); setSize(sizeFor(t, r));
  };

  const inp = 'rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-2 py-1 text-sm';
  const Slider = ({ label, v, set, min, max }) => (
    <label className="block text-sm">
      <div className="flex justify-between"><span>{label}</span><span className="text-slate-500">{v}</span></div>
      <input type="range" min={min} max={max} value={v} onChange={e => set(+e.target.value)} className="w-full" />
    </label>
  );

  return (
    <div className="min-h-screen p-3 md:p-5 grid gap-4 md:grid-cols-[22rem_1fr]">
      <aside className="bg-white dark:bg-slate-900 rounded-xl shadow p-4 space-y-4 md:max-h-[calc(100vh-2.5rem)] md:overflow-y-auto">
        <div className="flex items-center justify-between">
          <h1 className="text-lg font-bold">Parliament Chart</h1>
          <button onClick={() => setDark(d => !d)} className={inp}>{dark ? 'Light' : 'Dark'}</button>
        </div>
        <select value={preset} onChange={e => loadPreset(e.target.value)} className={inp + ' w-full'}>
          {Object.entries(PRESETS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <div className="flex gap-1 text-sm">
          {[['parties', 'Parties'], ['layout', 'Layout Controls']].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)}
              className={'flex-1 py-1.5 rounded ' + (tab === k ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800')}>{l}</button>
          ))}
        </div>

        {tab === 'parties' ? (
          <div className="space-y-2">
            {parties.map(p => (
              <div key={p.id} onMouseEnter={() => setHoverParty(p.id)} onMouseLeave={() => setHoverParty(null)}
                className="border border-slate-200 dark:border-slate-700 rounded-lg p-2 space-y-1.5">
                <div className="flex gap-1.5 items-center">
                  <input type="color" value={p.color} onChange={e => update(p.id, { color: e.target.value })} className="w-8 h-8 p-0 border-0 bg-transparent" />
                  <input value={p.name} onChange={e => update(p.id, { name: e.target.value })} className={inp + ' flex-1 min-w-0'} />
                  <button onClick={() => remove(p.id)} className="text-red-500 px-1" title="Delete">✕</button>
                </div>
                <div className="flex items-center gap-2 text-sm">
                  <input type="number" min="0" value={p.seats}
                    onChange={e => update(p.id, { seats: Math.max(0, parseInt(e.target.value) || 0) })} className={inp + ' w-24'} />
                  <span className="text-slate-500">seats</span>
                  <label className="ml-auto flex items-center gap-1">
                    <input type="checkbox" checked={coalition.includes(p.id)} onChange={() => toggleCoal(p.id)} /> Coalition
                  </label>
                </div>
              </div>
            ))}
            <button onClick={add} className="w-full py-1.5 rounded bg-slate-100 dark:bg-slate-800 text-sm">+ Add party</button>
            <div className="flex items-center gap-2 text-sm pt-1">
              <span>Scale to</span>
              <input type="number" min="1" value={scaleTo} onChange={e => setScaleTo(+e.target.value)} className={inp + ' w-24'} />
              <button onClick={scale} className="px-3 py-1 rounded bg-indigo-600 text-white">Apply</button>
            </div>
          </div>
        ) : (
          <div className="space-y-3">
            <select value={layout} onChange={e => setLayout(e.target.value)} className={inp + ' w-full'}>
              <option value="hemicycle">Hemicycle</option>
              <option value="circle">Full circle</option>
              <option value="classroom">Classroom</option>
              <option value="westminster">Westminster</option>
            </select>
            <Slider label="Rows" v={rows} set={setRows} min={1} max={20} />
            <Slider label="Seat size" v={size} set={setSize} min={2} max={16} />
            <Slider label="Margin angle" v={margin} set={setMargin} min={0} max={40} />
            <Slider label="Inner radius" v={inner} set={setInner} min={20} max={250} />
            <Slider label="Outer radius" v={outer} set={setOuter} min={150} max={500} />
          </div>
        )}
      </aside>

      <main className="bg-white dark:bg-slate-900 rounded-xl shadow p-4 flex flex-col gap-3 min-w-0">
        {coalition.length > 0 && (
          <div className={'rounded-lg px-4 py-2 text-sm font-medium ' + (coalSeats >= majority
            ? 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-200'
            : 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200')}>
            Coalition: {coalSeats} seats — {coalSeats >= majority ? 'Majority Secured' : `needs ${majority - coalSeats} more`}
          </div>
        )}
        <div className="flex-1 flex items-center justify-center" style={{ minHeight: '50vh' }}>
          {seats.length ? (
            <svg viewBox={viewBox} className="w-full" style={{ maxHeight: '70vh' }}>
              {seats.map((s, i) => {
                const p = parties[s.p];
                if (!p) return null;
                let op = 1;
                if (hoverParty && p.id !== hoverParty) op = 0.15;
                else if (coalition.length && !coalition.includes(p.id)) op = 0.25;
                return (
                  <circle key={i} cx={s.x} cy={s.y} r={hoverSeat === i ? size * 1.35 : size} fill={p.color} opacity={op}
                    onMouseEnter={() => setHoverSeat(i)} onMouseLeave={() => setHoverSeat(null)} style={{ transition: 'opacity .15s' }}>
                    <title>{p.name} (seat {i + 1})</title>
                  </circle>
                );
              })}
            </svg>
          ) : <p className="text-slate-500">Add a party with seats to draw the chart.</p>}
        </div>
        <footer className="border-t border-slate-200 dark:border-slate-700 pt-3 text-sm space-y-2">
          <div>Total seats: <b>{total}</b> · Majority threshold: <b>{majority}</b></div>
          <div className="flex flex-wrap gap-x-4 gap-y-1">
            {parties.map(p => (
              <span key={p.id} className="flex items-center gap-1.5">
                <span className="inline-block w-3 h-3 rounded-full" style={{ background: p.color }}></span>{p.name} ({p.seats})
              </span>
            ))}
          </div>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
