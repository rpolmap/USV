<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parliament Customizer & Visualizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- FIX: Tailwind CDN defaults to OS-based dark mode; the toggle needs class mode -->
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="root"></div>
 
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
 
const PRESETS = {
  demo100: { name: "Classic Three-Party (100 Seats)", numRows: 5, seatRadius: 9, parties: [
    { id: '1', name: 'Socialists', seats: 37, color: '#EF4444' },
    { id: '2', name: 'Conservatives', seats: 24, color: '#06B6D4' },
    { id: '3', name: 'Republicans', seats: 39, color: '#3B82F6' } ] },
  germanBundestag: { name: "German Bundestag 2021 (736 Seats)", numRows: 14, seatRadius: 4.5, parties: [
    { id: '1', name: 'The Left', seats: 39, color: '#BE3075' },
    { id: '2', name: 'SPD', seats: 206, color: '#DC2626' },
    { id: '3', name: 'Greens', seats: 118, color: '#16A34A' },
    { id: '4', name: 'SSW', seats: 1, color: '#2563EB' },
    { id: '5', name: 'FDP', seats: 92, color: '#FACC15' },
    { id: '6', name: 'CDU/CSU', seats: 197, color: '#374151' },
    { id: '7', name: 'AfD', seats: 83, color: '#0EA5E9' } ] },
  usSenate: { name: "US Senate (100 Seats)", numRows: 5, seatRadius: 9.5, parties: [
    { id: '1', name: 'Democrats', seats: 48, color: '#2563EB' },
    { id: '2', name: 'Independents', seats: 3, color: '#10B981' },
    { id: '3', name: 'Republicans', seats: 49, color: '#EF4444' } ] },
  empty: { name: "Empty / Start from Scratch", numRows: 5, seatRadius: 9, parties: [] }
};
 
// Split `total` as evenly as possible into `n` parts (never negative)
const splitEven = (total, n) => Array.from({ length: n }, (_, i) =>
  Math.floor(total / n) + (i < total % n ? 1 : 0));
 
// Distribute seats over concentric rows proportional to radius
const ringRows = (total, n, inner, outer) => {
  const rows = Array.from({ length: n }, (_, r) => ({
    radius: inner + (r * (outer - inner)) / (n - 1 || 1), seats: 0 }));
  const sum = rows.reduce((s, r) => s + r.radius, 0);
  let used = 0;
  rows.forEach(r => { r.seats = Math.floor(total * r.radius / sum); used += r.seats; });
  for (let rem = total - used, i = n - 1; rem > 0; rem--, i = (i - 1 + n) % n) rows[i].seats++;
  return rows;
};
 
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [activeTab, setActiveTab] = useState('parties');
  const [layoutStyle, setLayoutStyle] = useState('semicircle');
  const [presetKey, setPresetKey] = useState('demo100');
  const [parties, setParties] = useState(PRESETS.demo100.parties);
  const [targetSeatsInput, setTargetSeatsInput] = useState("100");
  const [numRows, setNumRows] = useState(5);
  const [paddingAngle, setPaddingAngle] = useState(5);
  const [seatRadius, setSeatRadius] = useState(9);
  const [innerRadius, setInnerRadius] = useState(150);
  const [outerRadius, setOuterRadius] = useState(300);
  const [selectedParties, setSelectedParties] = useState(new Set());
  const [hoveredParty, setHoveredParty] = useState(null);
  const [hoveredSeat, setHoveredSeat] = useState(null);
 
  const totalSeats = useMemo(() => parties.reduce((s, p) => s + p.seats, 0), [parties]);
  const majorityThreshold = totalSeats > 0 ? Math.floor(totalSeats / 2) + 1 : 0;
 
  useEffect(() => { if (totalSeats > 0) setTargetSeatsInput(String(totalSeats)); }, [totalSeats]);
 
  useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
    document.body.className = darkMode
      ? "bg-slate-900 text-slate-100 min-h-screen"
      : "bg-slate-50 text-slate-900 min-h-screen";
  }, [darkMode]);
 
  const autoOptimizeLayoutForCount = (n) => {
    const [rows, size] = n <= 100 ? [5, 9] : n <= 250 ? [8, 7.5] : n <= 450 ? [11, 6]
      : n <= 800 ? [14, 4.5] : [18, 3.5];
    setNumRows(rows); setSeatRadius(size);
  };
 
  const handleScaleTotalSeats = (value) => {
    const target = parseInt(value);
    if (isNaN(target) || target < 1 || parties.length === 0 || totalSeats === 0) return;
    const items = parties.map(p => {
      const exact = (p.seats / totalSeats) * target;
      return { id: p.id, share: Math.floor(exact), rem: exact - Math.floor(exact) };
    });
    let leftover = target - items.reduce((s, i) => s + i.share, 0);
    [...items].sort((a, b) => b.rem - a.rem).forEach(i => { if (leftover > 0) { i.share++; leftover--; } });
    const map = Object.fromEntries(items.map(i => [i.id, i.share]));
    setParties(parties.map(p => ({ ...p, seats: map[p.id] })));
    autoOptimizeLayoutForCount(target);
  };
 
  const loadPreset = (key) => {
    const p = PRESETS[key];
    setPresetKey(key);
    setParties(p.parties.map(x => ({ ...x })));
    setNumRows(p.numRows);
    setSeatRadius(p.seatRadius);
    setSelectedParties(new Set());
  };
 
  const addParty = () => {
    const colors = ['#EF4444', '#3B82F6', '#10B981', '#FACC15', '#EC4899', '#8B5CF6', '#F97316', '#06B6D4'];
    setParties([...parties, { id: Date.now().toString(), name: `Party ${parties.length + 1}`,
      seats: 15, color: colors[parties.length % colors.length] }]);
  };
 
  const deleteParty = (id) => {
    setParties(parties.filter(p => p.id !== id));
    const next = new Set(selectedParties); next.delete(id); setSelectedParties(next);
  };
 
  const updateParty = (id, field, value) => setParties(parties.map(p => {
    if (p.id !== id) return p;
    return { ...p, [field]: field === 'seats' ? Math.max(0, parseInt(value) || 0) : value };
  }));
 
  const togglePartySelection = (id) => {
    const next = new Set(selectedParties);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelectedParties(next);
  };
 
  const seats = useMemo(() => {
    if (totalSeats === 0) return [];
    const out = [];
    const n = Math.max(1, numRows);
 
    if (layoutStyle === 'semicircle') {
      const pad = (paddingAngle * Math.PI) / 180;
      const start = Math.PI - pad, range = Math.PI - 2 * pad;
      ringRows(totalSeats, n, innerRadius, outerRadius).forEach(row => {
        for (let s = 0; s < row.seats; s++) {
          const angle = start - (s * range) / (row.seats - 1 || 1);
          out.push({ x: row.radius * Math.cos(angle), y: -row.radius * Math.sin(angle), angle });
        }
      });
      out.sort((a, b) => b.angle - a.angle);
    } else if (layoutStyle === 'fullcircle') {
      ringRows(totalSeats, n, innerRadius, outerRadius).forEach(row => {
        for (let s = 0; s < row.seats; s++) {
          const angle = Math.PI + (s * 2 * Math.PI) / row.seats;
          out.push({ x: row.radius * Math.cos(angle), y: row.radius * Math.sin(angle), angle });
        }
      });
      out.sort((a, b) => a.angle - b.angle);
    } else if (layoutStyle === 'classroom') {
      const rowHeight = (outerRadius - innerRadius) / (n - 1 || 1);
      splitEven(totalSeats, n).forEach((count, r) => {
        const width = 240 + r * 30;
        for (let s = 0; s < count; s++) {
          out.push({ x: count > 1 ? -width / 2 + (s * width) / (count - 1) : 0,
                     y: -(innerRadius + r * rowHeight) });
        }
      });
      out.sort((a, b) => a.x - b.x);
    } else if (layoutStyle === 'westminster') {
      const benches = Math.max(2, Math.floor(n / 2));
      const left = Math.ceil(totalSeats / 2);
      [[-1, left], [1, totalSeats - left]].forEach(([dir, sideTotal]) => {
        splitEven(sideTotal, benches).forEach((count, b) => {
          const x = dir * (30 + b * 28);
          const startY = -220 - ((count - 1) * 20) / 2;
          for (let s = 0; s < count; s++) out.push({ x, y: startY + s * 20 });
        });
      });
      out.sort((a, b) => a.x - b.x);
    }
 
    let i = 0;
    parties.forEach(party => {
      for (let k = 0; k < party.seats && i < out.length; k++, i++) out[i].party = party;
    });
    out.forEach((s, idx) => { s.id = `seat-${idx}`; });
    return out;
  }, [parties, totalSeats, numRows, paddingAngle, innerRadius, outerRadius, layoutStyle]);
 
  // FIX: fit the viewBox to the actual seats so no layout gets clipped
  const viewBox = useMemo(() => {
    if (!seats.length) return "-350 -350 700 400";
    const m = seatRadius * 2;
    const xs = seats.map(s => s.x), ys = seats.map(s => s.y);
    const x0 = Math.min(...xs) - m, x1 = Math.max(...xs) + m;
    const y0 = Math.min(...ys) - m, y1 = Math.max(...ys) + m;
    return `${x0} ${y0} ${x1 - x0} ${y1 - y0}`;
  }, [seats, seatRadius]);
 
  const coalitionSeatsTotal = parties.filter(p => selectedParties.has(p.id)).reduce((s, p) => s + p.seats, 0);
  const inputCls = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg";
 
  const Slider = ({ label, unit = "", value, set, min, max, step = 1, parse = parseInt }) => (
    <div>
      <div className="flex justify-between text-xs font-medium mb-1"><span>{label}</span><span>{value}{unit}</span></div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => set(parse(e.target.value))} className="w-full accent-indigo-600" />
    </div>
  );
 
  return (
    <div className="flex flex-col min-h-screen">
      <header className="border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
        <h1 className="text-xl font-bold tracking-tight">Parliament Customizer & Visualizer</h1>
        <button onClick={() => setDarkMode(!darkMode)}
          className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          {darkMode ? '☀️ Light' : '🌙 Dark'}
        </button>
      </header>
 
      <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
        <div className="lg:col-span-4 flex flex-col gap-6 bg-white dark:bg-slate-800/60 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div>
            <label className="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2 block">Presets</label>
            <select value={presetKey} onChange={e => loadPreset(e.target.value)}
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm">
              {Object.entries(PRESETS).map(([k, p]) => <option key={k} value={k}>{p.name}</option>)}
            </select>
          </div>
 
          <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
            {[['parties', `Parties (${parties.length})`], ['layout', 'Layout Controls']].map(([k, label]) => (
              <button key={k} onClick={() => setActiveTab(k)}
                className={`flex-1 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === k ? 'bg-white dark:bg-slate-800 shadow' : 'text-slate-500'}`}>
                {label}
              </button>
            ))}
          </div>
 
          {activeTab === 'parties' && (
            <div className="flex flex-col gap-4 overflow-y-auto max-h-[500px] pr-1">
              <div className="flex justify-between items-center">
                <span className="text-sm font-semibold">Total Seats: {totalSeats}</span>
                <button onClick={addParty} className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">+ Add Party</button>
              </div>
              <div className="flex items-center gap-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                <span className="text-xs font-medium text-slate-500">Scale to:</span>
                <input type="number" value={targetSeatsInput} onChange={e => setTargetSeatsInput(e.target.value)}
                  className={`w-20 px-2 py-1 text-xs text-center ${inputCls}`} />
                <button onClick={() => handleScaleTotalSeats(targetSeatsInput)}
                  className="px-2.5 py-1 bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg">Apply</button>
              </div>
              {parties.map(party => (
                <div key={party.id}
                  onMouseEnter={() => setHoveredParty(party.id)} onMouseLeave={() => setHoveredParty(null)}
                  className={`p-3 rounded-xl border transition flex flex-col gap-2 ${selectedParties.has(party.id) ? 'border-indigo-500 bg-indigo-500/5' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40'}`}>
                  <div className="flex items-center justify-between gap-2">
                    <input type="color" value={party.color} onChange={e => updateParty(party.id, 'color', e.target.value)}
                      className="w-6 h-6 rounded border-0 cursor-pointer bg-transparent" />
                    <input type="text" value={party.name} onChange={e => updateParty(party.id, 'name', e.target.value)}
                      className="flex-1 min-w-0 bg-transparent font-medium text-sm focus:outline-none border-b border-transparent focus:border-indigo-500" />
                    <button onClick={() => togglePartySelection(party.id)}
                      className={`px-2 py-0.5 text-xs rounded border ${selectedParties.has(party.id) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 dark:border-slate-600'}`}>Coalition</button>
                    <button onClick={() => deleteParty(party.id)} className="text-slate-400 hover:text-red-500 text-xs px-1">✕</button>
                  </div>
                  <div className="flex items-center justify-between text-xs text-slate-500">
                    <span>Seats:</span>
                    <input type="number" min="0" value={party.seats} onChange={e => updateParty(party.id, 'seats', e.target.value)}
                      className={`w-16 px-1.5 py-0.5 text-right font-medium text-slate-900 dark:text-slate-100 ${inputCls}`} />
                  </div>
                </div>
              ))}
            </div>
          )}
 
          {activeTab === 'layout' && (
            <div className="flex flex-col gap-4">
              <div>
                <label className="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1 block">Seating Layout Style</label>
                <select value={layoutStyle} onChange={e => setLayoutStyle(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm">
                  <option value="semicircle">Hemicycle / Semicircle</option>
                  <option value="fullcircle">Full Circle</option>
                  <option value="classroom">Classroom / Grid</option>
                  <option value="westminster">Westminster / Benches</option>
                </select>
              </div>
              <Slider label="Number of Rows" value={numRows} set={setNumRows} min={1} max={25} />
              <Slider label="Seat Size" unit="px" value={seatRadius} set={setSeatRadius} min={2} max={15} step={0.5} parse={parseFloat} />
              {layoutStyle === 'semicircle' && <Slider label="Side Margin Angle" unit="°" value={paddingAngle} set={setPaddingAngle} min={0} max={30} />}
              <Slider label="Inner Radius" unit="px" value={innerRadius} set={setInnerRadius} min={50} max={250} />
              <Slider label="Outer Radius" unit="px" value={outerRadius} set={setOuterRadius} min={200} max={450} />
            </div>
          )}
        </div>
 
        <div className="lg:col-span-8 bg-white dark:bg-slate-800/60 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between items-center relative overflow-hidden min-h-[500px]">
          {selectedParties.size > 0 && (
            <div className="w-full bg-indigo-600 text-white p-3 rounded-xl shadow-lg flex items-center justify-between z-10 mb-2">
              <span className="font-bold text-sm">Selected Coalition <span className="text-xs font-normal opacity-90">({selectedParties.size} parties)</span></span>
              <div className="flex items-center gap-4 text-sm font-semibold">
                <span>Seats: {coalitionSeatsTotal} / {totalSeats}</span>
                <span className={`px-2 py-0.5 rounded text-xs ${coalitionSeatsTotal >= majorityThreshold ? 'bg-emerald-500' : 'bg-indigo-800 text-indigo-200'}`}>
                  {coalitionSeatsTotal >= majorityThreshold ? 'Majority Secured' : `Needs ${majorityThreshold - coalitionSeatsTotal} more`}
                </span>
              </div>
            </div>
          )}
 
          <div className="w-full flex-1 flex items-center justify-center">
            <svg viewBox={viewBox} className="w-full h-full max-h-[500px]">
              {seats.map(seat => {
                const isHovered = hoveredSeat === seat.id || (hoveredParty && seat.party?.id === hoveredParty);
                const inCoalition = seat.party && selectedParties.has(seat.party.id);
                let opacity = 1;
                if (selectedParties.size > 0 && !inCoalition) opacity = 0.25;
                if (hoveredParty && seat.party?.id !== hoveredParty) opacity = 0.2;
                return (
                  <circle key={seat.id} cx={seat.x} cy={seat.y}
                    r={isHovered ? seatRadius * 1.3 : seatRadius}
                    fill={seat.party ? seat.party.color : '#94a3b8'} opacity={opacity}
                    stroke={isHovered ? '#ffffff' : 'none'} strokeWidth="2"
                    className="cursor-pointer"
                    onMouseEnter={() => setHoveredSeat(seat.id)} onMouseLeave={() => setHoveredSeat(null)}>
                    <title>{seat.party ? `${seat.party.name} (${seat.party.seats} seats)` : 'Unassigned'}</title>
                  </circle>
                );
              })}
            </svg>
          </div>
 
          <div className="w-full pt-4 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
            <div>Majority Threshold: <span className="font-semibold text-slate-700 dark:text-slate-300">{majorityThreshold} Seats</span></div>
            <div className="flex flex-wrap gap-4">
              {parties.map(p => (
                <div key={p.id} className="flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.color }}></span>
                  <span>{p.name}: {p.seats}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
